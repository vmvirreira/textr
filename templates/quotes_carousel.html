{% extends 'base.html' %}

{% block content %}
<main class="slides-page">
  <div class="category-wheel" role="group" aria-label="Choose a content type">
    <button class="wheel-option wheel-all" data-category="all" type="button">All</button>
    {% for key, label in content_types.items() %}
      <button class="wheel-option wheel-{{ key }}" data-category="{{ key }}" type="button">{{ label }}</button>
    {% endfor %}
  </div>

  <section id="content-stage" class="content-stage" aria-live="polite">
    <p id="content-type" class="content-type"></p>
    <h2 id="content-title" class="content-title" hidden></h2>
    <p id="content-text" class="content-text"></p>
    <p id="content-author" class="content-author"></p>
    <p id="content-source" class="content-source" hidden>
      From <a id="content-source-link" href="" target="_blank" rel="noopener noreferrer"></a>
    </p>
  </section>

  <div class="slide-progress" aria-hidden="true">
    <span id="slide-progress-bar" class="slide-progress-bar"></span>
  </div>

  <div class="slide-controls" aria-label="Slide controls">
    <button id="prev" class="slide-button" type="button" aria-label="Previous item" title="Previous">&larr;</button>
    <button id="pause" class="slide-button pause-button" type="button" aria-label="Pause slides" title="Pause">&#10074;&#10074;</button>
    <button id="next" class="slide-button" type="button" aria-label="Next item" title="Next">&rarr;</button>
  </div>
  <p id="slide-status" class="sr-only" role="status"></p>
</main>

<script>
  const localItems = {{ quotes|tojson }};
  const initialCategory = {{ selected_category|tojson }};
  const typeLabels = {{ content_types|tojson }};
  const textElement = document.getElementById('content-text');
  const authorElement = document.getElementById('content-author');
  const titleElement = document.getElementById('content-title');
  const typeElement = document.getElementById('content-type');
  const sourceElement = document.getElementById('content-source');
  const sourceLinkElement = document.getElementById('content-source-link');
  const statusElement = document.getElementById('slide-status');
  const stageElement = document.getElementById('content-stage');
  const prevButton = document.getElementById('prev');
  const nextButton = document.getElementById('next');
  const pauseButton = document.getElementById('pause');
  const progressBarElement = document.getElementById('slide-progress-bar');
  const wheelButtons = [...document.querySelectorAll('.wheel-option')];
  const slideDuration = 8000;
  const itemHistoryLimit = 100;

  let selectedCategory = initialCategory;
  let items = [];
  let currentIndex = 0;
  let loading = false;
  let playing = true;
  let timer;

  function shuffled(values) {
    const result = [...values];
    for (let index = result.length - 1; index > 0; index -= 1) {
      const swapIndex = Math.floor(Math.random() * (index + 1));
      [result[index], result[swapIndex]] = [result[swapIndex], result[index]];
    }
    return result;
  }

  function filteredLocalItems() {
    const matches = selectedCategory === 'all'
      ? localItems
      : localItems.filter((item) => item.category === selectedCategory);
    return shuffled(matches);
  }

  function renderItem() {
    const item = items[currentIndex];
    if (!item) {
      typeElement.textContent = selectedCategory === 'all' ? 'All' : typeLabels[selectedCategory];
      textElement.textContent = 'Finding something for you...';
      authorElement.textContent = '';
      titleElement.hidden = true;
      sourceElement.hidden = true;
      prevButton.disabled = true;
      return;
    }

    typeElement.textContent = typeLabels[item.category] || 'Words';
    textElement.textContent = item.text;
    authorElement.textContent = item.author ? `- ${item.author}` : '';
    titleElement.textContent = item.title || '';
    titleElement.hidden = !item.title;
    if (item.source_url) {
      sourceLinkElement.href = item.source_url;
      sourceLinkElement.textContent = item.source;
      sourceElement.hidden = false;
    } else {
      sourceElement.hidden = true;
    }
    prevButton.disabled = currentIndex === 0;
  }

  function transitionTo(callback) {
    stageElement.classList.add('is-changing');
    return new Promise((resolve) => {
      window.setTimeout(() => {
        callback();
        stageElement.classList.remove('is-changing');
        resolve();
      }, 180);
    });
  }

  async function fetchExternalItem() {
    if (loading) return null;
    loading = true;
    nextButton.disabled = true;
    statusElement.textContent = 'Finding another item...';
    try {
      const providerType = selectedCategory === 'all' ? 'all' : selectedCategory;
      const response = await fetch(`/api/content/random?type=${encodeURIComponent(providerType)}`);
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || 'Content provider unavailable.');
      statusElement.textContent = `Added from ${payload.source}.`;
      return payload;
    } catch (error) {
      statusElement.textContent = 'The outside source is unavailable. The slideshow will try again.';
      return null;
    } finally {
      loading = false;
      nextButton.disabled = false;
    }
  }

  async function nextItem() {
    if (currentIndex < items.length - 1) {
      await transitionTo(() => {
        currentIndex += 1;
        renderItem();
      });
      return;
    }

    const currentItem = items[currentIndex];
    const externalItem = await fetchExternalItem();
    if (externalItem) {
      items.push(externalItem);
      await transitionTo(() => {
        currentIndex += 1;
        if (items.length > itemHistoryLimit) {
          items.shift();
          currentIndex -= 1;
        }
        renderItem();
      });
      return;
    }

    const localFallback = filteredLocalItems();
    if (currentItem?.source === 'textr' && localFallback.length) {
      items = localFallback;
      currentIndex = 0;
      await transitionTo(renderItem);
    }
  }

  async function previousItem() {
    if (currentIndex === 0) return;
    await transitionTo(() => {
      currentIndex -= 1;
      renderItem();
    });
  }

  async function chooseCategory(category) {
    selectedCategory = category;
    currentIndex = 0;
    items = filteredLocalItems();
    wheelButtons.forEach((button) => {
      const active = button.dataset.category === selectedCategory;
      button.classList.toggle('is-active', active);
      button.setAttribute('aria-pressed', String(active));
    });
    const url = new URL(window.location.href);
    url.searchParams.set('category', selectedCategory);
    window.history.replaceState({}, '', url);
    statusElement.textContent = '';
    renderItem();
    if (!items.length) {
      const externalItem = await fetchExternalItem();
      if (externalItem && selectedCategory === category) {
        items = [externalItem];
        renderItem();
      }
    }
    scheduleNext();
  }

  function restartProgress() {
    progressBarElement.classList.remove('is-running', 'is-paused');
    void progressBarElement.offsetWidth;
    if (playing && !document.hidden) progressBarElement.classList.add('is-running');
  }

  function scheduleNext() {
    window.clearTimeout(timer);
    restartProgress();
    if (playing && !document.hidden) {
      timer = window.setTimeout(async () => {
        await nextItem();
        scheduleNext();
      }, slideDuration);
    }
  }

  function togglePlayback() {
    playing = !playing;
    pauseButton.innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';
    pauseButton.setAttribute('aria-label', playing ? 'Pause slides' : 'Play slides');
    pauseButton.title = playing ? 'Pause' : 'Play';
    if (playing) {
      scheduleNext();
    } else {
      window.clearTimeout(timer);
      progressBarElement.classList.add('is-paused');
    }
  }

  prevButton.addEventListener('click', async () => {
    await previousItem();
    scheduleNext();
  });
  nextButton.addEventListener('click', async () => {
    await nextItem();
    scheduleNext();
  });
  pauseButton.addEventListener('click', togglePlayback);
  wheelButtons.forEach((button) => {
    button.addEventListener('click', () => chooseCategory(button.dataset.category));
  });
  document.addEventListener('keydown', async (event) => {
    if (event.key === 'ArrowLeft') await previousItem();
    if (event.key === 'ArrowRight') await nextItem();
    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') scheduleNext();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      window.clearTimeout(timer);
      progressBarElement.classList.add('is-paused');
    } else if (playing) {
      scheduleNext();
    }
  });

  chooseCategory(initialCategory);
</script>

<style>
  .slides-page {
    min-height: calc(100vh - 7rem);
    padding-bottom: 2rem;
    color: #151a17;
  }
  .content-type {
    margin: 0 0 0.25rem;
    color: #44705a;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0;
    text-transform: uppercase;
  }
  .category-wheel {
    position: relative;
    width: 12rem;
    height: 12rem;
    margin: 0 auto;
    border: 1px solid #cbd5cf;
    border-radius: 50%;
    background: #f5f7f6;
  }
  .wheel-option {
    position: absolute;
    min-width: 4.5rem;
    min-height: 2.5rem;
    padding: 0.45rem 0.65rem;
    border: 1px solid #9eaca5;
    border-radius: 1.25rem;
    background: #ffffff;
    color: #27352e;
    font-weight: 600;
    transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease;
  }
  .wheel-option:hover,
  .wheel-option:focus-visible {
    border-color: #1f5b3e;
    outline: none;
  }
  .wheel-option.is-active {
    border-color: #173f2c;
    background: #173f2c;
    color: #ffffff;
  }
  .wheel-all { left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .wheel-quotes { left: 50%; top: 0.55rem; transform: translateX(-50%); }
  .wheel-jokes { left: 0.1rem; bottom: 1rem; }
  .wheel-poems { right: 0.1rem; bottom: 1rem; }
  .content-stage {
    display: flex;
    min-height: 20rem;
    max-width: 54rem;
    margin: 0 auto;
    padding: 2rem 1rem 1rem;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    opacity: 1;
    transition: opacity 180ms ease;
  }
  .content-stage.is-changing { opacity: 0; }
  .content-title {
    margin: 0.5rem 0;
    font-size: 1.2rem;
    font-weight: 600;
  }
  .content-text {
    margin: 0;
    font-size: 2rem;
    line-height: 1.5;
    white-space: pre-line;
  }
  .content-author { margin: 1.25rem 0 0; color: #44524b; }
  .content-source { margin: 0.5rem 0 0; color: #65736c; font-size: 0.8rem; }
  .content-source a { color: inherit; text-decoration: underline; }
  .slide-progress {
    width: min(24rem, calc(100% - 2rem));
    height: 2px;
    margin: 0 auto 1rem;
    overflow: hidden;
    background: #d8dfdb;
  }
  .slide-progress-bar {
    display: block;
    width: 100%;
    height: 100%;
    background: #44705a;
    transform: scaleX(0);
    transform-origin: left;
  }
  .slide-progress-bar.is-running {
    animation: slide-progress 8s linear forwards;
  }
  .slide-progress-bar.is-paused {
    animation-play-state: paused;
  }
  @keyframes slide-progress {
    to { transform: scaleX(1); }
  }
  .slide-controls {
    display: flex;
    justify-content: center;
    gap: 0.75rem;
    margin-top: 0;
  }
  .slide-button {
    width: 3rem;
    height: 3rem;
    border: 1px solid #88968f;
    border-radius: 50%;
    background: #ffffff;
    color: #173f2c;
    font-size: 1.25rem;
  }
  .slide-button:hover:not(:disabled),
  .slide-button:focus-visible {
    border-color: #173f2c;
    background: #eef3f0;
    outline: none;
  }
  .slide-button:disabled { cursor: not-allowed; opacity: 0.35; }
  .pause-button { font-size: 0.8rem; }
  @media (max-width: 575px) {
    .slides-page { min-height: calc(100vh - 6rem); }
    .category-wheel { width: 10.5rem; height: 10.5rem; }
    .wheel-option { min-width: 4rem; font-size: 0.85rem; }
    .content-stage { min-height: 18rem; padding-top: 1.25rem; }
    .content-text { font-size: 1.35rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .content-stage,
    .wheel-option { transition: none; }
    .slide-progress-bar.is-running { animation: none; transform: scaleX(1); }
  }
</style>
{% endblock %}
