{% extends 'base.html' %}

{% block content %}
<main class="slides-page">
  <div class="category-wheel" role="group" aria-label="Choose a content type">
    <button class="wheel-option wheel-all" data-category="all" type="button">All</button>
    {% for key, label in content_types.items() %}
      <button class="wheel-option wheel-{{ key }}" data-category="{{ key }}" type="button">{{ label }}</button>
    {% endfor %}
  </div>

  <div class="words-radio" role="group" aria-label="Words background radio">
    <div class="radio-label"><span>EDM / CHILL RADIO</span><i id="radio-live-indicator"></i></div>
    <button id="radio-prev" type="button" aria-label="Previous radio station" title="Previous station">&larr;</button>
    <button id="radio-play" class="radio-play" type="button" aria-label="Play background radio" title="Play"></button>
    <button id="radio-next" type="button" aria-label="Next radio station" title="Next station">&rarr;</button>
    <div class="radio-station"><b id="radio-station-name"></b><span id="radio-station-description"></span></div>
    <p id="radio-status" role="status">Paused</p>
    <audio id="radio-audio" preload="none"></audio>
  </div>

  <section id="content-stage" class="content-stage" aria-live="polite">
    <p id="content-type" class="content-type"></p>
    <h2 id="content-title" class="content-title" hidden></h2>
    <p id="content-text" class="content-text"></p>
    <p id="content-author" class="content-author"></p>
    <p id="content-source" class="content-source" hidden>
      From <a id="content-source-link" href="" target="_blank" rel="noopener noreferrer"></a>
    </p>
  </section>

  <div class="slide-progress" aria-hidden="true">
    <span id="slide-progress-bar" class="slide-progress-bar"></span>
  </div>

  <div class="slide-controls" aria-label="Slide controls">
    <button id="prev" class="slide-button" type="button" aria-label="Previous item" title="Previous">&larr;</button>
    <button id="pause" class="slide-button pause-button" type="button" aria-label="Pause slides" title="Pause">&#10074;&#10074;</button>
    <button id="next" class="slide-button" type="button" aria-label="Next item" title="Next">&rarr;</button>
  </div>
  <p id="slide-status" class="sr-only" role="status"></p>
</main>

<script>
  const localItems = {{ quotes|tojson }};
  const initialCategory = {{ selected_category|tojson }};
  const typeLabels = {{ content_types|tojson }};
  const textElement = document.getElementById('content-text');
  const authorElement = document.getElementById('content-author');
  const titleElement = document.getElementById('content-title');
  const typeElement = document.getElementById('content-type');
  const sourceElement = document.getElementById('content-source');
  const sourceLinkElement = document.getElementById('content-source-link');
  const statusElement = document.getElementById('slide-status');
  const stageElement = document.getElementById('content-stage');
  const prevButton = document.getElementById('prev');
  const nextButton = document.getElementById('next');
  const pauseButton = document.getElementById('pause');
  const progressBarElement = document.getElementById('slide-progress-bar');
  const wheelButtons = [...document.querySelectorAll('.wheel-option')];
  const slideDuration = 8000;
  const itemHistoryLimit = 100;
  const radioStations = [
    { name: 'Groove Salad', description: 'Ambient and downtempo', source: 'https://ice5.somafm.com/groovesalad-128-mp3' },
    { name: 'Beat Blender', description: 'Deep house and downtempo chill', source: 'https://ice5.somafm.com/beatblender-128-mp3' },
    { name: 'Groove Salad Classic', description: 'Classic ambient and electronic', source: 'https://ice5.somafm.com/gsclassic-128-mp3' },
    { name: 'Space Station Soma', description: 'Ambient and mid-tempo electronica', source: 'https://ice5.somafm.com/spacestation-128-mp3' },
    { name: 'Deep Space One', description: 'Deep ambient electronic', source: 'https://ice5.somafm.com/deepspaceone-128-mp3' },
  ];
  const radioAudio = document.getElementById('radio-audio');
  const radioPlayButton = document.getElementById('radio-play');
  const radioStationName = document.getElementById('radio-station-name');
  const radioStationDescription = document.getElementById('radio-station-description');
  const radioStatus = document.getElementById('radio-status');
  const radioLiveIndicator = document.getElementById('radio-live-indicator');

  let selectedCategory = initialCategory;
  let items = [];
  let currentIndex = 0;
  let navigating = false;
  let playing = true;
  let externalItemPromise = null;
  let externalRequestCategory = null;
  let externalRequestSequence = 0;
  const externalRequestHandlers = new Map();
  let radioStationIndex = 0;
  let timer;

  function shuffled(values) {
    const result = [...values];
    for (let index = result.length - 1; index > 0; index -= 1) {
      const swapIndex = Math.floor(Math.random() * (index + 1));
      [result[index], result[swapIndex]] = [result[swapIndex], result[index]];
    }
    return result;
  }

  function filteredLocalItems() {
    const matches = selectedCategory === 'all'
      ? localItems
      : localItems.filter((item) => item.category === selectedCategory);
    return shuffled(matches);
  }

  function renderItem() {
    const item = items[currentIndex];
    if (!item) {
      typeElement.textContent = selectedCategory === 'all' ? 'All' : typeLabels[selectedCategory];
      textElement.textContent = 'Finding something for you...';
      authorElement.textContent = '';
      titleElement.hidden = true;
      sourceElement.hidden = true;
      prevButton.disabled = true;
      return;
    }

    typeElement.textContent = typeLabels[item.category] || 'Words';
    textElement.textContent = item.text;
    authorElement.textContent = item.author ? `- ${item.author}` : '';
    titleElement.textContent = item.title || '';
    titleElement.hidden = !item.title;
    if (item.source_url) {
      sourceLinkElement.href = item.source_url;
      sourceLinkElement.textContent = item.source;
      sourceElement.hidden = false;
    } else {
      sourceElement.hidden = true;
    }
    prevButton.disabled = currentIndex === 0;
  }

  function transitionTo(callback) {
    stageElement.classList.add('is-changing');
    return new Promise((resolve) => {
      window.setTimeout(() => {
        callback();
        stageElement.classList.remove('is-changing');
        resolve();
      }, 180);
    });
  }

  window.textrReceiveExternalItem = (payload) => {
    const handler = externalRequestHandlers.get(payload.requestId);
    if (!handler) return;
    if (payload.error) handler.reject(new Error(payload.error));
    else handler.resolve(payload.item);
  };

  function requestExternalItem(category) {
    const providerType = category === 'all' ? 'all' : category;
    externalRequestSequence += 1;
    const requestId = `${Date.now()}-${externalRequestSequence}`;
    return new Promise((resolve, reject) => {
      const script = document.createElement('script');
      let settled = false;
      const finish = (callback, value) => {
        if (settled) return;
        settled = true;
        window.clearTimeout(timeoutId);
        externalRequestHandlers.delete(requestId);
        script.remove();
        callback(value);
      };
      const timeoutId = window.setTimeout(() => {
        finish(reject, new Error('External content request timed out.'));
      }, 10000);
      externalRequestHandlers.set(requestId, {
        resolve: (item) => finish(resolve, item),
        reject: (error) => finish(reject, error),
      });
      script.async = true;
      const routePrefix = window.location.pathname.startsWith('/words/') ? '/words' : '';
      script.src = `${routePrefix}/content/next.js?type=${encodeURIComponent(providerType)}&request_id=${encodeURIComponent(requestId)}`;
      script.onerror = () => finish(reject, new Error('External content request failed.'));
      document.head.appendChild(script);
    });
  }

  function prefetchExternalItem() {
    if (externalItemPromise && externalRequestCategory === selectedCategory) return;
    const category = selectedCategory;
    externalRequestCategory = category;
    externalItemPromise = requestExternalItem(category)
      .then((item) => ({ category, item }))
      .catch(() => ({ category, item: null }));
  }

  async function fetchExternalItem() {
    if (!externalItemPromise || externalRequestCategory !== selectedCategory) prefetchExternalItem();
    const requestPromise = externalItemPromise;
    statusElement.textContent = 'Finding another item...';
    try {
      const result = await requestPromise;
      if (result.category !== selectedCategory || !result.item) {
        statusElement.textContent = 'The outside source is unavailable. The slideshow will try again.';
        return null;
      }
      statusElement.textContent = `Added from ${result.item.source}.`;
      return result.item;
    } finally {
      if (externalItemPromise === requestPromise) {
        externalItemPromise = null;
        externalRequestCategory = null;
      }
    }
  }

  async function nextItem() {
    if (navigating) return;
    navigating = true;
    nextButton.disabled = true;
    try {
      if (items.length && currentIndex >= items.length) currentIndex = items.length - 1;
      if (currentIndex < items.length - 1) {
        await transitionTo(() => {
          currentIndex += 1;
          renderItem();
        });
        return;
      }

      const externalItem = await fetchExternalItem();
      if (!externalItem) return;

      items.push(externalItem);
      prefetchExternalItem();
      await transitionTo(() => {
        if (items.length > itemHistoryLimit) {
          items.shift();
        }
        currentIndex = items.length - 1;
        renderItem();
      });
    } finally {
      navigating = false;
      nextButton.disabled = false;
      prevButton.disabled = currentIndex === 0;
    }
  }

  async function previousItem() {
    if (navigating || currentIndex === 0) return;
    navigating = true;
    prevButton.disabled = true;
    nextButton.disabled = true;
    try {
      await transitionTo(() => {
        currentIndex = Math.min(currentIndex - 1, items.length - 1);
        renderItem();
      });
    } finally {
      navigating = false;
      nextButton.disabled = false;
      prevButton.disabled = currentIndex === 0;
    }
  }

  async function chooseCategory(category) {
    selectedCategory = category;
    currentIndex = 0;
    externalItemPromise = null;
    externalRequestCategory = null;
    items = filteredLocalItems();
    wheelButtons.forEach((button) => {
      const active = button.dataset.category === selectedCategory;
      button.classList.toggle('is-active', active);
      button.setAttribute('aria-pressed', String(active));
    });
    const url = new URL(window.location.href);
    url.searchParams.set('category', selectedCategory);
    window.history.replaceState({}, '', url);
    statusElement.textContent = '';
    renderItem();
    if (!items.length) {
      prefetchExternalItem();
      const externalItem = await fetchExternalItem();
      if (externalItem && selectedCategory === category) {
        items = [externalItem];
        prefetchExternalItem();
        renderItem();
      }
    } else {
      prefetchExternalItem();
    }
    scheduleNext();
  }

  function restartProgress() {
    progressBarElement.classList.remove('is-running', 'is-paused');
    void progressBarElement.offsetWidth;
    if (playing && !document.hidden) progressBarElement.classList.add('is-running');
  }

  function scheduleNext() {
    window.clearTimeout(timer);
    restartProgress();
    if (playing && !document.hidden) {
      timer = window.setTimeout(async () => {
        await nextItem();
        scheduleNext();
      }, slideDuration);
    }
  }

  function togglePlayback() {
    playing = !playing;
    pauseButton.innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';
    pauseButton.setAttribute('aria-label', playing ? 'Pause slides' : 'Play slides');
    pauseButton.title = playing ? 'Pause' : 'Play';
    if (playing) {
      scheduleNext();
    } else {
      window.clearTimeout(timer);
      progressBarElement.classList.add('is-paused');
    }
  }

  function renderRadioStation() {
    const station = radioStations[radioStationIndex];
    radioStationName.textContent = station.name;
    radioStationDescription.textContent = station.description;
    radioAudio.src = station.source;
    radioAudio.load();
  }

  function setRadioPlaying(isPlaying) {
    radioPlayButton.classList.toggle('is-playing', isPlaying);
    radioPlayButton.setAttribute('aria-label', isPlaying ? 'Pause background radio' : 'Play background radio');
    radioPlayButton.title = isPlaying ? 'Pause' : 'Play';
    radioLiveIndicator.classList.toggle('is-live', isPlaying);
  }

  async function playRadio() {
    try {
      await radioAudio.play();
      radioStatus.textContent = 'On air';
    } catch (error) {
      radioStatus.textContent = 'Stream unavailable - try next';
      setRadioPlaying(false);
    }
  }

  async function toggleRadio() {
    if (!radioAudio.paused) {
      radioAudio.pause();
      radioStatus.textContent = 'Paused';
      return;
    }
    radioStatus.textContent = 'Tuning...';
    await playRadio();
  }

  async function changeRadioStation(direction, continuePlaying = !radioAudio.paused) {
    radioAudio.pause();
    radioStationIndex = (radioStationIndex + direction + radioStations.length) % radioStations.length;
    radioStatus.textContent = 'Tuning...';
    renderRadioStation();
    if (continuePlaying) await playRadio();
    else radioStatus.textContent = 'Paused';
  }

  prevButton.addEventListener('click', async () => {
    await previousItem();
    scheduleNext();
  });
  nextButton.addEventListener('click', async () => {
    await nextItem();
    scheduleNext();
  });
  pauseButton.addEventListener('click', togglePlayback);
  radioPlayButton.addEventListener('click', toggleRadio);
  document.getElementById('radio-prev').addEventListener('click', () => changeRadioStation(-1));
  document.getElementById('radio-next').addEventListener('click', () => changeRadioStation(1));
  radioAudio.addEventListener('play', () => setRadioPlaying(true));
  radioAudio.addEventListener('pause', () => setRadioPlaying(false));
  radioAudio.addEventListener('ended', () => changeRadioStation(1, true));
  radioAudio.addEventListener('error', () => {
    radioStatus.textContent = 'Stream unavailable - try next';
    setRadioPlaying(false);
  });
  wheelButtons.forEach((button) => {
    button.addEventListener('click', () => chooseCategory(button.dataset.category));
  });
  document.addEventListener('keydown', async (event) => {
    if (event.key === 'ArrowLeft') await previousItem();
    if (event.key === 'ArrowRight') await nextItem();
    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') scheduleNext();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      window.clearTimeout(timer);
      progressBarElement.classList.add('is-paused');
    } else if (playing) {
      scheduleNext();
    }
  });

  renderRadioStation();
  chooseCategory(initialCategory);
</script>

<style>
  .slides-page {
    min-height: calc(100vh - 7rem);
    padding-bottom: 2rem;
    color: #151a17;
  }
  .content-type {
    margin: 0 0 0.25rem;
    color: #44705a;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0;
    text-transform: uppercase;
  }
  .words-radio {
    display: grid;
    grid-template-columns: auto 2.5rem 2.75rem 2.5rem minmax(10rem, 1fr) auto;
    align-items: center;
    gap: 0.4rem;
    width: min(56rem, calc(100% - 2rem));
    min-height: 3.75rem;
    margin: 1.25rem auto 0;
    padding: 0.5rem 0;
    border-top: 1px solid #cbd5cf;
    border-bottom: 1px solid #cbd5cf;
  }
  .words-radio button {
    width: 100%;
    height: 2.25rem;
    padding: 0;
    border: 1px solid #9eaca5;
    border-radius: 0;
    background: #ffffff;
    color: #173f2c;
  }
  .words-radio button:hover,
  .words-radio button:focus-visible,
  .words-radio .radio-play {
    border-color: #173f2c;
    background: #eef3f0;
    outline: none;
  }
  .radio-play::before {
    display: block;
    width: 0;
    height: 0;
    margin: 0 auto;
    border-top: 0.32rem solid transparent;
    border-bottom: 0.32rem solid transparent;
    border-left: 0.5rem solid currentColor;
    content: '';
  }
  .radio-play.is-playing::before {
    width: 0.5rem;
    height: 0.65rem;
    border: 0;
    border-right: 0.18rem solid currentColor;
    border-left: 0.18rem solid currentColor;
  }
  .radio-label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding-right: 0.5rem;
    color: #65736c;
    font-size: 0.7rem;
    font-weight: 700;
  }
  .radio-label i {
    width: 0.45rem;
    height: 0.45rem;
    border-radius: 50%;
    background: #a5aea9;
  }
  .radio-label i.is-live {
    background: #2c8b5a;
    box-shadow: 0 0 0.5rem rgba(44, 139, 90, 0.45);
  }
  .radio-station {
    display: flex;
    min-width: 0;
    align-items: baseline;
    gap: 0.65rem;
    padding-left: 0.5rem;
  }
  .radio-station b { white-space: nowrap; }
  .radio-station span,
  .words-radio > p {
    overflow: hidden;
    color: #65736c;
    font-size: 0.7rem;
    text-overflow: ellipsis;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .words-radio > p { margin: 0; text-align: right; }
  .category-wheel {
    position: relative;
    width: 12rem;
    height: 12rem;
    margin: 0 auto;
    border: 1px solid #cbd5cf;
    border-radius: 50%;
    background: #f5f7f6;
  }
  .wheel-option {
    position: absolute;
    min-width: 4.5rem;
    min-height: 2.5rem;
    padding: 0.45rem 0.65rem;
    border: 1px solid #9eaca5;
    border-radius: 1.25rem;
    background: #ffffff;
    color: #27352e;
    font-weight: 600;
    transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease;
  }
  .wheel-option:hover,
  .wheel-option:focus-visible {
    border-color: #1f5b3e;
    outline: none;
  }
  .wheel-option.is-active {
    border-color: #173f2c;
    background: #173f2c;
    color: #ffffff;
  }
  .wheel-all { left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .wheel-quotes { left: 50%; top: 0.55rem; transform: translateX(-50%); }
  .wheel-jokes { left: 0.1rem; bottom: 1rem; }
  .wheel-poems { right: 0.1rem; bottom: 1rem; }
  .content-stage {
    display: flex;
    min-height: 20rem;
    max-width: 54rem;
    margin: 0 auto;
    padding: 2rem 1rem 1rem;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    opacity: 1;
    transition: opacity 180ms ease;
  }
  .content-stage.is-changing { opacity: 0; }
  .content-title {
    margin: 0.5rem 0;
    font-size: 1.2rem;
    font-weight: 600;
  }
  .content-text {
    margin: 0;
    font-size: 2rem;
    line-height: 1.5;
    white-space: pre-line;
  }
  .content-author { margin: 1.25rem 0 0; color: #44524b; }
  .content-source { margin: 0.5rem 0 0; color: #65736c; font-size: 0.8rem; }
  .content-source a { color: inherit; text-decoration: underline; }
  .slide-progress {
    width: min(24rem, calc(100% - 2rem));
    height: 2px;
    margin: 0 auto 1rem;
    overflow: hidden;
    background: #d8dfdb;
  }
  .slide-progress-bar {
    display: block;
    width: 100%;
    height: 100%;
    background: #44705a;
    transform: scaleX(0);
    transform-origin: left;
  }
  .slide-progress-bar.is-running {
    animation: slide-progress 8s linear forwards;
  }
  .slide-progress-bar.is-paused {
    animation-play-state: paused;
  }
  @keyframes slide-progress {
    to { transform: scaleX(1); }
  }
  .slide-controls {
    display: flex;
    justify-content: center;
    gap: 0.75rem;
    margin-top: 0;
  }
  .slide-button {
    width: 3rem;
    height: 3rem;
    border: 1px solid #88968f;
    border-radius: 50%;
    background: #ffffff;
    color: #173f2c;
    font-size: 1.25rem;
  }
  .slide-button:hover:not(:disabled),
  .slide-button:focus-visible {
    border-color: #173f2c;
    background: #eef3f0;
    outline: none;
  }
  .slide-button:disabled { cursor: not-allowed; opacity: 0.35; }
  .pause-button { font-size: 0.8rem; }
  @media (max-width: 575px) {
    .slides-page { min-height: calc(100vh - 6rem); }
    .category-wheel { width: 10.5rem; height: 10.5rem; }
    .wheel-option { min-width: 4rem; font-size: 0.85rem; }
    .content-stage { min-height: 18rem; padding-top: 1.25rem; }
    .content-text { font-size: 1.35rem; }
    .words-radio {
      grid-template-columns: 2.2rem 2.5rem 2.2rem minmax(5rem, 1fr);
      gap: 0.25rem;
    }
    .radio-label,
    .radio-station span,
    .words-radio > p { display: none; }
    .radio-station { padding-left: 0.35rem; }
    .radio-station b { overflow: hidden; font-size: 0.8rem; text-overflow: ellipsis; }
  }
  @media (prefers-reduced-motion: reduce) {
    .content-stage,
    .wheel-option { transition: none; }
    .slide-progress-bar.is-running { animation: none; transform: scaleX(1); }
  }
</style>
{% endblock %}
